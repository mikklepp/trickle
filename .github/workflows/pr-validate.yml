name: PR Validation

on:
  pull_request:
    branches:
      - main
      - cdk

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build backend
        run: npm run build --workspace=backend

      # Asserts every (module, export) pair the CDK stack wires actually
      # resolves. esbuild verifies the entry *file* at synth; nothing else
      # verifies the *export*, so a renamed handler would reach production.
      - name: Test
        run: npm test

      - name: Build frontend
        run: npm run build --workspace=frontend

      # Synthesize the CDK app. This used to be skipped because synth needs AWS
      # (STS account lookup + Route53 HostedZone.fromLookup) and Dependabot PRs
      # get no secrets -- which meant anything breaking only the deploy path
      # passed PR checks and failed on push to main. cdk/cdk.context.json now
      # caches the hosted-zone lookup, and the account is supplied directly, so
      # this runs credential-free. It also exercises esbuild bundling of all 12
      # Lambdas, which nothing else in CI covers.
      - name: Synth CDK app
        working-directory: cdk
        env:
          CDK_DEFAULT_ACCOUNT: "917371804581"
          CDK_REGION: eu-west-1
          CDK_STAGE: ci
          AUTH_USERNAME: ci
          AUTH_PASSWORD: ci
        run: npx cdk synth --all --quiet

      - name: Check formatting
        run: npm run format:check
