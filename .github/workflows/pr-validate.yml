name: PR Validation

on:
  pull_request:
    branches:
      - main
      - cdk

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build backend
        run: npm run build --workspace=backend

      # Backend: asserts every (module, export) pair the CDK stack wires
      # actually resolves -- esbuild verifies the entry *file* at synth, nothing
      # else verifies the *export* -- plus unit tests for the pure logic.
      # Frontend: component tests under Vitest/jsdom. These cannot run on the
      # backend's `node --test`, because Node strips TypeScript types but does
      # not transform JSX.
      - name: Test
        run: npm test

      - name: Build frontend
        run: npm run build --workspace=frontend

      # Synthesize the CDK app, which is otherwise never exercised by CI:
      # synth needs AWS (STS account lookup + Route53 HostedZone.fromLookup) and
      # Dependabot PRs get no secrets, so anything breaking only the deploy path
      # used to pass PR checks and fail on push to main. Rather than commit the
      # real cdk.context.json (it would put the production account and hosted
      # zone ids in the repo), seed a throwaway one with entirely fake values --
      # synth only needs the lookup to resolve, not to be true. The file is
      # gitignored and never leaves the runner.
      #
      # This is also CI's only coverage of esbuild bundling all 12 Lambdas.
      - name: Synth CDK app
        working-directory: cdk
        env:
          CDK_DEFAULT_ACCOUNT: "000000000000"
          CDK_REGION: eu-west-1
          CDK_STAGE: ci
          AUTH_USERNAME: ci
          AUTH_PASSWORD: ci
        run: |
          cat > cdk.context.json <<'JSON'
          {
            "hosted-zone:account=000000000000:domainName=qed.fi:region=eu-west-1":
              { "Id": "/hostedzone/ZCIDUMMYCIDUMMY01", "Name": "qed.fi." },
            "hosted-zone:account=000000000000:domainName=qed.fi:region=us-east-1":
              { "Id": "/hostedzone/ZCIDUMMYCIDUMMY01", "Name": "qed.fi." }
          }
          JSON
          npx cdk synth --all --quiet

      # Import every bundle synth just produced, the way the runtime will.
      # Bundling can succeed and still emit code that dies on import: a
      # CommonJS dependency doing require() at runtime becomes an esbuild shim
      # that throws. That shipped once and took every JWT-using function down,
      # because nothing between synth and production ever executed a bundle.
      - name: Load synthesized Lambda bundles
        run: node scripts/check-lambda-bundles.mjs cdk/cdk.out

      - name: Check formatting
        run: npm run format:check
